version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - actions/*
          - DragoAnt/*
          - NuGet/*

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns:
          - Microsoft.*
          - System.*
      testing:
        patterns:
          - xunit*
          - Verify*
          - NSubstitute*
          - FluentAssertions
          - Bogus
          - coverlet.*
      benchmarks:
        patterns:
          - BenchmarkDotNet*
    ignore:
      # Versions after 32.0.0 require a paid maintenance subscription.
      - dependency-name: Verify
        versions:
          - '>32.0.0'
      - dependency-name: Verify.XunitV3
        versions:
          - '>32.0.0'
      # 8.x requires a commercial license.
      - dependency-name: FluentAssertions
        update-types:
          - version-update:semver-major
      # One version line per target framework (Directory.Packages.props); a major bump would break the older TFMs.
      - dependency-name: Microsoft.Extensions.*
        update-types:
          - version-update:semver-major

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
