name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    uses: DragoAnt/.github/.github/workflows/dotnet-build.yml@6c9ee08d87ec6e0d8f8b4dd4b76845f1bcb1d33f # feat/org-defaults, re-point to main after merge
    with:
      version: 0.0.0-ci.${{ github.run_number }}
      coverage-threshold: 70
